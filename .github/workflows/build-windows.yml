name: Build Windows exe

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download models
        run: python scripts/get_models.py

      - name: Smoke test
        run: python scripts/smoke_test.py

      - name: Build exe
        run: python scripts/build_exe.py

      - uses: actions/upload-artifact@v4
        with:
          name: WebcamFX-windows
          path: dist/WebcamFX.exe

      # Every push to main publishes a release, so
      # /releases/latest/download/WebcamFX.exe always points at the newest build.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WebcamFX build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/WebcamFX.exe
